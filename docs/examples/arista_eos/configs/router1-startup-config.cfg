no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$LzPltUUvdzARJZJg$FUAP6WZUykjU1g5PBu6uxI/8Vivad40zE50Mi1CBruKqt9LazrgI8gcGVe7lJlP5es8Z/.850qM69csYpaE0P/
! 
ip route 192.168.139.0/24 10.100.0.1
! 
interface ethernet1
	description ISP1
	no switchport
	ip address 192.168.1.1/30
	no shutdown

interface ethernet2
	description ISP2
	no switchport
	ip address 192.168.2.1/30
	no shutdown
	
interface ethernet3
	description EXABGP
	no switchport
	ip address 10.100.0.2/24
	no shutdown

interface ethernet4
	description Router B2B
	no switchport
	ip address 192.168.100.1/30
	no shutdown
	
spanning-tree mode none

ip routing	
ipv6 routing

ip community-list rbth-in permit 65001:666
ip route 192.168.12.12/32 Null0 name rbth-in
route-map rbth-in permit 5
   match community rbth-in
   set ip next-hop 192.168.12.12
route-map rbth-in permit 10

ip large-community-list isp1-rbth-in permit 65001:123:666
ip large-community-list isp1-add-prepend-one permit 65001:123:1
ip large-community-list isp1-add-prepend-two permit 65001:123:2
ip large-community-list isp1-add-prepend-three permit 65001:123:3

route-map isp1-ipv4-out-rm permit 5
	match large-community isp1-rbth-in
	set community 123:666
route-map isp1-ipv4-out-rm permit 10
	match community rbth-in
	set community 123:666
route-map isp1-ipv4-out-rm permit 101
	match large-community isp1-add-prepend-one
	set as-path prepend 65001
route-map isp1-ipv4-out-rm permit 102
	match large-community isp1-add-prepend-two
	set as-path prepend 65001 65001
route-map isp1-ipv4-out-rm permit 103
	match large-community isp1-add-prepend-three
	set as-path prepend 65001 65001 65001
route-map isp1-ipv4-out-rm permit 1000

ip large-community-list isp2-rbth-in permit 65001:456:666
ip large-community-list isp2-add-prepend-one permit 65001:456:1
ip large-community-list isp2-add-prepend-two permit 65001:456:2
ip large-community-list isp2-add-prepend-three permit 65001:456:3

route-map isp2-ipv4-out-rm permit 5
   match large-community isp2-rbth-in
   set community 456:666
route-map isp2-ipv4-out-rm permit 10
   match community rbth-in
   set community 456:666
route-map isp2-ipv4-out-rm permit 101
	match large-community isp2-add-prepend-one
	set as-path prepend 65001
route-map isp2-ipv4-out-rm permit 102
	match large-community isp2-add-prepend-two
	set as-path prepend 65001 65001
route-map isp2-ipv4-out-rm permit 103
	match large-community isp2-add-prepend-three
	set as-path prepend 65001 65001 65001
route-map isp2-ipv4-out-rm permit 1000


router bgp 65001
   neighbor 192.168.100.2 remote-as 65001
   neighbor 192.168.100.2 send-community
   neighbor 192.168.100.2 description Router2
   neighbor 10.100.0.1 remote-as 65000
   neighbor 10.100.0.1 description Exabgp
   neighbor 10.100.0.1 additional-paths receive
   neighbor 10.100.0.1 send-community
   neighbor 10.100.0.1 route-map rbth-in in
   neighbor 10.100.0.1 weight 300
   neighbor 192.168.1.2 remote-as 123
   neighbor 192.168.1.2 description Isp1
   neighbor 192.168.1.2 send-community
   neighbor 192.168.1.2 route-map isp1-ipv4-out-rm out
   neighbor 192.168.2.2 remote-as 456
   neighbor 192.168.2.2 description Isp2
   neighbor 192.168.2.2 send-community
   neighbor 192.168.2.2 route-map isp2-ipv4-out-rm out
   redistribute connected
   redistribute static

   !
   address-family ipv4
      bgp additional-paths install
      neighbor 10.100.0.1 activate
      neighbor 192.168.1.2 activate
      neighbor 192.168.2.2 activate
   !
   address-family ipv6
      neighbor 10.100.0.1 activate
   ! 
   address-family flow-spec ipv4 
      neighbor 10.100.0.1 activate