global
    log         /dev/log local0
    maxconn     4096
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      forwardfor
    option      http-server-close
    timeout     connect 5s
    timeout     client  60s
    timeout     server  60s
    retries     3

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────

frontend http_front
    bind *:80
    http-request redirect scheme https code 301

# ── HTTPS frontend ────────────────────────────────────────────────────────────

frontend https_front
    bind *:443 ssl crt /etc/ssl/haproxy/haproxy.pem
    default_backend api_backend

    # Pass real client IP to Flask
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https

    # Basic security headers added at proxy level
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"

# ── Flask API backend ─────────────────────────────────────────────────────────

backend api_backend
    balance     roundrobin
    option      httpchk GET /login
    http-check  expect status 200

    # api = Docker service name, 5001 = Flask port (internal only, not published to host)
    server      api api:5001 check inter 10s rise 2 fall 3
